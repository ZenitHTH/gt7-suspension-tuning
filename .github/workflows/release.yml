name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override release version (defaults to VERSION file)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite & Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Release Version
        id: meta
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            # Auto-increment on every push to main: patch-bump the highest
            # existing vX.Y.Z tag; when no tags exist yet, fall back to the
            # VERSION file. (Releases are created by this workflow, so the
            # tag list is the single source of truth for the next number.)
            latest="$(git ls-remote --tags origin \
              | sed -n 's@.*refs/tags/v\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)$@\1@p' \
              | sort -V | tail -n 1)"
            if [[ -n "${latest}" ]]; then
              major="${latest%%.*}"
              rest="${latest#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              VER="${major}.${minor}.$((patch + 1))"
              echo "Auto-incrementing from v${latest} -> v${VER}"
            else
              VER="$(tr -d '[:space:]' < VERSION)"
            fi
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VER} (tag: v${VER})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (offscreen Qt)
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

  build-windows:
    name: Build Windows App (GT7Tuner)
    needs: [test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build GT7Tuner (PyInstaller)
        # Single line on purpose: Windows runners default to PowerShell, where
        # cmd-style ^ continuations are a parse error.
        run: python -m PyInstaller --noconfirm --clean --windowed --name GT7Tuner --paths . --paths scripts --add-data "data;data" --hidden-import gt7_constants --hidden-import setup gui\__main__.py

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path dist/GT7Tuner -DestinationPath "GT7Tuner-Windows-v${env:VERSION}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7Tuner-Windows
          path: GT7Tuner-Windows-v${{ env.VERSION }}.zip
          retention-days: 14

  build-macos:
    name: Build macOS App (GT7Tuner)
    needs: [test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build GT7Tuner (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean --windowed --name GT7Tuner --paths . --paths scripts --add-data "data:data" --hidden-import gt7_constants --hidden-import setup gui/__main__.py

      - name: Package macOS build
        run: ditto -c -k --sequesterRsrc --keepParent dist/GT7Tuner "GT7Tuner-macOS-v${VERSION}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7Tuner-macOS
          path: GT7Tuner-macOS-v${{ env.VERSION }}.zip
          retention-days: 14

  build-linux:
    name: Build Linux AppImage (GT7Tuner)
    needs: [test]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        # Same Qt/X11 libs as the test job: PyInstaller needs them present to
        # resolve NEEDED entries, and linuxdeploy bundles them into the image.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build GT7Tuner (PyInstaller AppImage)
        # --target AppImage (PyInstaller >= 6.5) runs linuxdeploy + appimagetool
        # automatically; it bundles the Qt/X11 runtime into the image, so the
        # result runs on stock x86_64 distros (glibc-based; no ARM).
        run: python -m PyInstaller --noconfirm --clean --windowed --target AppImage --name GT7Tuner --paths . --paths scripts --add-data "data:data" --hidden-import gt7_constants --hidden-import setup gui/__main__.py

      - name: Package Linux build
        run: zip -j "GT7Tuner-Linux-v${VERSION}.zip" dist/GT7Tuner/*.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7Tuner-Linux
          path: GT7Tuner-Linux-v${{ env.VERSION }}.zip
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      TAG: ${{ needs.test.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & Release Notes
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cd ..

          cat <<EOF > RELEASE_NOTES.md
          ## GT7 Suspension Tuner — Release v${VERSION}

          First-principles race-engineing auto-tuner for Gran Turismo 7:
          grid-search suspension solver, 3-point G-force calibration,
          tire grip-limit check, trail-braking bottoming proof, and
          bilingual (EN/TH) setup sheets. CLI and PyQt6 GUI.

          | Platform | Asset |
          | :--- | :--- |
          | **🪟 Windows** | \`GT7Tuner-Windows-v${VERSION}.zip\` (unzip → run GT7Tuner.exe) |
          | **🍎 macOS** | \`GT7Tuner-macOS-v${VERSION}.zip\` (unzip → run GT7Tuner.app) |
          | **🐧 Linux** | \`GT7Tuner-Linux-v${VERSION}.zip\` (unzip → \`chmod +x\` → run GT7Tuner-x86_64.AppImage) |

          > **Checksums**: Verify downloads against \`SHA256SUMS.txt\`.
          > **CLI only** (no GUI needed): clone and run \`python3 cli.py\` — the physics core is stdlib-only.
          EOF

      - name: Clean Stale Release & Tag Before Publish
        run: |
          gh release delete "latest" --cleanup-tag -y 2>/dev/null || true
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            gh release delete "${TAG}" --cleanup-tag -y 2>/dev/null || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GT7 Suspension Tuner v${{ needs.test.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.test.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.test.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*